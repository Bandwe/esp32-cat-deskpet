<svg xmlns="http://www.w3.org/2000/svg" width="240" height="280" viewBox="0 0 240 280" fill="none">
  <title>Black kitten — V06 wink</title>
  <desc>Simple cat-eye expression on pure black. Flat golden irises, black pupils and one white highlight per open eye. No iris texture, gradients, rim strokes, secondary highlights or tongue crease. Expression silhouettes retained from V05. Small flat pink tongue. Static vector preview, not firmware.</desc>
  
  <rect id="background" width="240" height="280" fill="#000000"/>
  <g id="eye-left" transform="translate(68 140)">
    <g>
      <ellipse id="iris-left" rx="25.5" ry="26.5" fill="#FFDA7B"/>
      <ellipse id="pupil-left" cx="1.3" cy="-2.2" rx="21.3" ry="22" fill="#000000"/>
      <circle id="catchlight-left" cx="-7" cy="-10" r="4" fill="#FFFFFF"/>
    </g>
  </g>
  <g id="eye-right" transform="translate(172 140)">
      <path id="closed-lid-right" d="M-23 7C-11-7 11-7 23 7" stroke="#FFDA7B" stroke-width="4" stroke-linecap="round"/>
    </g>
  <path id="tongue" d="M107 191C112 186 129 186 134 191C139 197 131 210 122 211C111 213 104 205 105 197Q105 193 107 191Z" fill="#EF98A1"/>
</svg>
